  <style>
  #cityshow{position:relative;max-width:1200px;margin:48px auto 0;padding:0 20px;}
  .city-stage{position:relative;height:380px;perspective:1200px;}
  .city-card{
    position:absolute;top:50%;left:50%;
    width:480px;max-width:90%;
    transform-origin:center center;
    transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .55s ease,filter .55s ease;
    border-radius:var(--radius-lg);overflow:hidden;
    border:1px solid var(--border);background:var(--bg-3);
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;cursor:pointer;
  }
  .city-card img{width:100%;height:320px;object-fit:cover;display:block;}

  /* 当前居中卡片 */
  .city-card.is-center{left:50%;transform:translate(-50%,-50%) scale(1);opacity:1;z-index:10;pointer-events:auto;filter:none;}
  /* 1 层外 */
  .city-card.is-left1{left:50%;transform:translate(calc(-50% - 290px),-50%) scale(.78);opacity:.85;z-index:4;filter:blur(2px);pointer-events:auto;}
  .city-card.is-right1{left:50%;transform:translate(calc(-50% + 290px),-50%) scale(.78);opacity:.85;z-index:4;filter:blur(2px);pointer-events:auto;}
  /* 2 层外 */
  .city-card.is-left2{left:50%;transform:translate(calc(-50% - 480px),-50%) scale(.55);opacity:.45;z-index:2;filter:blur(5px);pointer-events:auto;}
  .city-card.is-right2{left:50%;transform:translate(calc(-50% + 480px),-50%) scale(.55);opacity:.45;z-index:2;filter:blur(5px);pointer-events:auto;}
  /* 超出视口（隐藏） */
  .city-card.is-far-left{left:50%;transform:translate(calc(-50% - 700px),-50%) scale(.4);opacity:0;z-index:1;filter:blur(8px);pointer-events:none;}
  .city-card.is-far-right{left:50%;transform:translate(calc(-50% + 700px),-50%) scale(.4);opacity:0;z-index:1;filter:blur(8px);pointer-events:none;}

  /* 文字信息面板 */
  .city-info-panel{
    text-align:left;padding:28px 0 8px;min-height:150px;
    transition:opacity .35s ease;max-width:680px;margin:0 auto;
  }
  .city-info-panel.fading{opacity:0;}
  .city-title{font-size:1.7rem;font-weight:800;color:var(--text);}
  .city-lord{margin-top:6px;font-size:1.05rem;color:var(--accent);font-weight:600;}
  .city-desc{margin-top:10px;color:var(--text-2);line-height:1.7;font-size:1rem;}

  .city-dots{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .city-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .25s;border:none;padding:0;}
  .city-dot.active{width:24px;background:var(--primary);border-radius:4px;}

  @media(max-width:768px){
    #cityshow{max-width:100%;padding:0 16px;}
    .city-stage{height:280px;}
    .city-card{width:300px;}
    .city-card img{height:200px;}
    .city-card.is-center{transform:translate(-50%,-50%) scale(1);}
    .city-card.is-left1{transform:translate(calc(-50% - 190px),-50%) scale(.6);}
    .city-card.is-right1{transform:translate(calc(-50% + 190px),-50%) scale(.6);}
    .city-card.is-left2,.city-card.is-right2{opacity:0;}
    .city-title{font-size:1.2rem;}
    .city-info-panel{padding:16px 12px 4px;min-height:120px;}
  }
  </style>

      {

        img: "Minecraft%20style%20fortified%20hilltop%20town%2C%20stone%20walls%2C%20watch%20fires%2C%20valley%20below%2C%20defensive%20keep%2C%20dusk",

      },
      {

        lord: "BVVD",
        img: "Minecraft%20style%20chaotic%20colorful%20playground%20city%2C%20rainbow%20blocks%2C%20wild%20builds%2C%20prank%20machines%2C%20fun%20and%20messy%2C%20vibrant",
        desc: "熊孩子们的乐园，混乱与创意并存的自由之地。"
      },
      {
        name: "津岚城",
        lord: "aKr_1437",
        img: "Minecraft%20style%20misty%20mountain%20town%20with%20waterfalls%20and%20rivers%2C%20floating%20fog%2C%20lush%20green%20valley%2C%20serene",
        desc: "山岚水雾环绕的水陆枢纽，渔歌与商船在此交织。"
      },
      {
        name: "锡安城",
        lord: "jingfeng553",
        img: "Minecraft%20style%20holy%20city%20on%20mountain%2C%20white%20stone%20temples%2C%20golden%20light%20from%20heaven%2C%20sacred%20atmosphere%2C%20divine",
        desc: "圣山之上的锡安圣城，白石神殿金光笼罩。"
      }
    ];

  const IMG = "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=";
  let cityIdx = 0, cityTimer = null;

  function buildCities(){
    const stage = document.getElementById('cityStage');
    const dots = document.getElementById('cityDots');
    stage.innerHTML = CITIES.map((c,i) => `
      <div class="city-card" data-idx="${i}">
        <img src="${IMG}${c.img}&image_size=landscape_4_3" alt="${c.name}" loading="lazy">
      </div>`).join('');
    dots.innerHTML = CITIES.map((_,i)=>`<button class="city-dot${i===0?' active':''}" onclick="cityGo(${i})" aria-label="城市${i+1}"></button>`).join('');

    // 点击卡片切换：左卡→上一张，右卡→下一张，中心卡不响应
    stage.querySelectorAll('.city-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = Number(card.dataset.idx);
        let off = idx - cityIdx;
        const n = CITIES.length;
        if(off > n/2) off -= n;
        if(off < -n/2) off += n;
        if(off === 0) return; // 点击中心卡无动作
        citySlide(off < 0 ? -1 : 1);
      });
    });

    updateCity();
  }

  function updateCity(){
    const n = CITIES.length;
    document.querySelectorAll('.city-card').forEach((card,i) => {
      let off = i - cityIdx;
      if(off > n/2) off -= n;
      if(off < -n/2) off += n;
      card.className = 'city-card';
      if(off === 0) card.classList.add('is-center');
      else if(off === -1) card.classList.add('is-left1');
      else if(off === 1) card.classList.add('is-right1');
      else if(off === -2) card.classList.add('is-left2');
      else if(off === 2) card.classList.add('is-right2');
      else if(off < -2) card.classList.add('is-far-left');
      else if(off > 2) card.classList.add('is-far-right');
    });
    document.querySelectorAll('.city-dot').forEach((d,i)=>d.classList.toggle('active', i===cityIdx));

    const panel = document.getElementById('cityInfo');
    const c = CITIES[cityIdx];
    panel.classList.add('fading');
    setTimeout(() => {
      panel.innerHTML = `
        <div class="city-title">${c.name}</div>
        <div class="city-lord">城主-${c.lord}</div>`;
      panel.classList.remove('fading');
    }, 180);
  }

  function citySlide(dir){
    cityIdx = (cityIdx + dir + CITIES.length) % CITIES.length;
    updateCity();
    resetCityTimer();
  }

  function cityGo(i){
    cityIdx = i;
    updateCity();
    resetCityTimer();
  }

  function autoCity(){
    cityIdx = (cityIdx + 1) % CITIES.length;
    updateCity();
  }

  function resetCityTimer(){
    if(cityTimer) clearInterval(cityTimer);
    cityTimer = setInterval(autoCity, 4500);
  }

  // 触摸滑动
  let touchStartX = 0;
  document.getElementById('cityStage').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  });
  document.getElementById('cityStage').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40) citySlide(dx > 0 ? -1 : 1);
  });

  buildCities();
  resetCityTimer();
  </script>
