  <style>
  .news-grid{display:block;margin-top:8px;}

  .news-row{

  .breaking-body{display:flex;align-items:center;gap:18px;padding:0 22px;flex:1;min-width:0;}
  .breaking-date{color:var(--primary-light);font-family:ui-monospace,SFMono-Regular,monospace;font-size:.85rem;white-space:nowrap;}
  .breaking-title{color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Hero 英文大标签 */

  <script>
  (function loadNews(){
    const API = 'https://api.newsistar.com';
    const arkDate = ts => {
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + ' // ' + p(d.getMonth() + 1) + ' / ' + p(d.getDate());
    };
    // 首页只显示最近 3 条，其余保留在后端（后续新闻页用同一 API 展示全部）
    fetch(API + '/api/news?limit=3')
      .then(r => r.ok ? r.json() : null)
      .then(r => {
        if (!r || !r.data || !r.data.length) return; // 无新闻保持占位
        const list = r.data;
        // BREAKING NEWS 条：取最新一条
        document.getElementById('breakingBar').style.display = 'block';
        document.getElementById('breakingDate').textContent = arkDate(list[0].created_at);
        document.getElementById('breakingTitle').textContent = list[0].title;
        // 公告列表（分类 + 方舟日期 + 标题，点击展开正文）
         document.getElementById('newsList').innerHTML = list.map((n, i) => `
           <article class="news-row">
             <span class="news-row-tag">公告</span>
             <span class="news-row-date">${arkDate(n.created_at)}</span>
             <h3 class="news-row-title"></h3>
             <span class="news-row-arrow">→</span>
             <div class="news-row-body">
                <div class="news-row-inner">
                  <p class="news-row-content"></p>
                  <div class="news-row-author">发布者：</div>
                </div>
              </div>
           </article>`).join('');
        // 安全填充文本（防XSS）
        document.querySelectorAll('.news-row-title').forEach((el, i) => { el.textContent = list[i].title; });
        document.querySelectorAll('.news-row-content').forEach((el, i) => { el.textContent = list[i].content; });
        document.querySelectorAll('.news-row-author').forEach((el, i) => { el.textContent += list[i].author; });
        // 点击展开/收起正文（JS 精确测高驱动动画）
        document.querySelectorAll('.news-row').forEach(row => {
          const body = row.querySelector('.news-row-body');
          row.addEventListener('click', () => {
            const opening = !row.classList.contains('open');
            if (opening) {
              row.classList.add('open');
              body.style.maxHeight = body.scrollHeight + 'px';
            } else {
              body.style.maxHeight = '0px';
              row.classList.remove('open');
            }
          });
        });
      })
      .catch(() => {}); // 网络失败保持"暂无新闻"
  })();
  </script>

  <style>
  #cityshow{position:relative;max-width:1200px;margin:48px auto 0;padding:0 20px;}
  .city-stage{position:relative;height:380px;perspective:1200px;}
  .city-card{
    position:absolute;top:50%;left:50%;
    width:480px;max-width:90%;
    transform-origin:center center;
    transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .55s ease,filter .55s ease;
    border-radius:var(--radius-lg);overflow:hidden;
    border:1px solid var(--border);background:var(--bg-3);
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;cursor:pointer;
  }
  /* 城市缩略：真实截图显示在占位之上；无图时显示渐变 + 城名 */
  .city-thumb{position:relative;width:100%;height:320px;overflow:hidden;
    background:linear-gradient(150deg,#1b2333 0%,#25344d 55%,#1d2a40 100%);}
  .city-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .city-fallback{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;
    background:radial-gradient(ellipse at 50% 35%,rgba(127,168,212,.14),transparent 70%);
  }
  .city-fallback .mk{
    width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(159,179,211,.5);transform:rotate(45deg);
    font-size:1.5rem;font-weight:800;color:#9fb3d3;background:rgba(127,168,212,.08);
    box-shadow:0 0 24px rgba(127,168,212,.2);
  }
  .city-fallback .mk span{transform:rotate(-45deg);}
  .city-fallback .nm{font-size:1.35rem;font-weight:800;letter-spacing:.3em;color:#cdd9ea;}
  .city-card img.off{display:none;}

  /* 当前居中卡片 */
  .city-card.is-center{left:50%;transform:translate(-50%,-50%) scale(1);opacity:1;z-index:10;pointer-events:auto;filter:none;}
  /* 1 层外 */
  .city-card.is-left1{left:50%;transform:translate(calc(-50% - 290px),-50%) scale(.78);opacity:.85;z-index:4;filter:blur(2px);pointer-events:auto;}
  .city-card.is-right1{left:50%;transform:translate(calc(-50% + 290px),-50%) scale(.78);opacity:.85;z-index:4;filter:blur(2px);pointer-events:auto;}
  /* 2 层外 */
  .city-card.is-left2{left:50%;transform:translate(calc(-50% - 480px),-50%) scale(.55);opacity:.45;z-index:2;filter:blur(5px);pointer-events:auto;}
  .city-card.is-right2{left:50%;transform:translate(calc(-50% + 480px),-50%) scale(.55);opacity:.45;z-index:2;filter:blur(5px);pointer-events:auto;}
  /* 超出视口（隐藏） */
  .city-card.is-far-left{left:50%;transform:translate(calc(-50% - 700px),-50%) scale(.4);opacity:0;z-index:1;filter:blur(8px);pointer-events:none;}
  .city-card.is-far-right{left:50%;transform:translate(calc(-50% + 700px),-50%) scale(.4);opacity:0;z-index:1;filter:blur(8px);pointer-events:none;}

  /* 文字信息面板 */
  .city-info-panel{
    text-align:left;padding:28px 0 8px;min-height:150px;
    transition:opacity .35s ease;max-width:680px;margin:0 auto;
  }
  .city-info-panel.fading{opacity:0;}
  .city-title{font-size:1.7rem;font-weight:800;color:var(--text);letter-spacing:.03em;}
  .city-lord{margin-top:6px;font-size:1.05rem;color:var(--accent);font-weight:600;letter-spacing:.18em;}
  .city-desc{margin-top:10px;color:var(--text-2);line-height:1.7;font-size:1rem;}

  .city-dots{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .city-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .25s;border:none;padding:0;}
  .city-dot.active{width:24px;background:var(--primary);border-radius:4px;}

  @media(max-width:768px){
    #cityshow{max-width:100%;padding:0 16px;}
    .city-stage{height:280px;}
    .city-card{width:300px;}
    .city-thumb{height:200px;}
    .city-card.is-center{transform:translate(-50%,-50%) scale(1);}
    .city-card.is-left1{transform:translate(calc(-50% - 190px),-50%) scale(.6);}
    .city-card.is-right1{transform:translate(calc(-50% + 190px),-50%) scale(.6);}
    .city-card.is-left2,.city-card.is-right2{opacity:0;}
    .city-title{font-size:1.2rem;}
    .city-info-panel{padding:16px 12px 4px;min-height:120px;}
  }
  </style>

  <script>
    // 城市数据：真实截图放 img/cities/城市名.png 即自动显示；无图时显示城徽占位（不使用 AI 生成图）
    const CITIES = [
      { name: "莆阳城", lord: "2323qw", desc: "古朴的水乡之城，木楼倒映河面，灯笼长明不熄。" },
      { name: "永宁城", lord: "yao2233", desc: "平原上的永久要塞，高墙永守，安宁无虞。" },
      { name: "鮀济大湾区", lord: "tychen", desc: "蛇济湾畔的繁华都市群，贸易与科技交汇之地。" },
      { name: "琉球首里城", lord: "tpoak", desc: "海岛山丘上的琉球古王城，红瓦绿椰，碧海蓝天。" },
      { name: "安西自由城", lord: "sun123321", desc: "大漠绿洲中的自由商贸城，八方商旅汇聚之所。" },
      { name: "阿穆尔生命制药公司", lord: "HinzaG", desc: "以生命科学为核心的制药巨头总部，药剂与实验的生产中心。" },
      { name: "断荒城", lord: "cyr20041009", desc: "荒原尽头的前哨之城，断壁残垣中铸就新生。" },
      { name: "新北自治区", lord: "opzc", desc: "北境针叶林中的自治聚落，冰雪与炉火共存。" },
      { name: "闽海城", lord: "yueyuezia", desc: "面朝大海的渔港之城，晨雾中千帆竞发。" },
      { name: "潮汐城", lord: "lucas", desc: "临海而建，潮汐涨落间见证商贸繁华的港口之城。" },
      { name: "晋泉", lord: "Achillesrtydy", desc: "泉水潺潺的古城，石渠穿巷，清流绕户。" },
      { name: "闽州城", lord: "ZBook", desc: "闽地州府，城墙巍峨，市井繁华。" },
      { name: "福宁城", lord: "tomato", desc: "山丘上的宁静堡垒，守望山谷的据点。" },
      { name: "熊孩子大联盟", lord: "BVVD", desc: "熊孩子们的乐园，混乱与创意并存的自由之地。" },
      { name: "津岚城", lord: "aKr_1437", desc: "山岚水雾环绕的水陆枢纽，渔歌与商船在此交织。" },
      { name: "锡安城", lord: "jingfeng553", desc: "圣山之上的锡安圣城，白石神殿金光笼罩。" }
    ];

  let cityIdx = 0, cityTimer = null;

  function buildCities(){
    const stage = document.getElementById('cityStage');
    const dots = document.getElementById('cityDots');
    stage.innerHTML = CITIES.map((c,i) => `
      <div class="city-card" data-idx="${i}">
        <div class="city-thumb">
          <img src="img/cities/${encodeURIComponent(c.name)}.png" alt="${c.name}" loading="lazy" onerror="this.classList.add('off')">
          <div class="city-fallback"><div class="mk"><span>${c.name.charAt(0)}</span></div><div class="nm">${c.name}</div></div>
        </div>
      </div>`).join('');
    dots.innerHTML = CITIES.map((_,i)=>`<button class="city-dot${i===0?' active':''}" onclick="cityGo(${i})" aria-label="城市${i+1}"></button>`).join('');

    // 点击卡片切换：左卡→上一张，右卡→下一张，中心卡不响应
    stage.querySelectorAll('.city-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = Number(card.dataset.idx);
        let off = idx - cityIdx;
        const n = CITIES.length;
        if(off > n/2) off -= n;
        if(off < -n/2) off += n;
        if(off === 0) return; // 点击中心卡无动作
        citySlide(off < 0 ? -1 : 1);
      });
    });

    updateCity();
  }

  function updateCity(){
    const n = CITIES.length;
    document.querySelectorAll('.city-card').forEach((card,i) => {
      let off = i - cityIdx;
      if(off > n/2) off -= n;
      if(off < -n/2) off += n;
      card.className = 'city-card';
      if(off === 0) card.classList.add('is-center');
      else if(off === -1) card.classList.add('is-left1');
      else if(off === 1) card.classList.add('is-right1');
      else if(off === -2) card.classList.add('is-left2');
      else if(off === 2) card.classList.add('is-right2');
      else if(off < -2) card.classList.add('is-far-left');
      else if(off > 2) card.classList.add('is-far-right');
    });
    document.querySelectorAll('.city-dot').forEach((d,i)=>d.classList.toggle('active', i===cityIdx));

    const panel = document.getElementById('cityInfo');
    const c = CITIES[cityIdx];
    panel.classList.add('fading');
    setTimeout(() => {
      panel.innerHTML = `
        <div class="city-title">${c.name}</div>
        <div class="city-lord">城主-${c.lord}</div>
        <div class="city-desc">${c.desc}</div>`;
      panel.classList.remove('fading');
    }, 180);
  }

  function citySlide(dir){
    cityIdx = (cityIdx + dir + CITIES.length) % CITIES.length;
    updateCity();
    resetCityTimer();
  }

  function cityGo(i){
    cityIdx = i;
    updateCity();
    resetCityTimer();
  }

  function autoCity(){
    cityIdx = (cityIdx + 1) % CITIES.length;
    updateCity();
  }

  function resetCityTimer(){
    if(cityTimer) clearInterval(cityTimer);
    cityTimer = setInterval(autoCity, 4500);
  }

  // 触摸滑动
  let touchStartX = 0;
  document.getElementById('cityStage').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  });
  document.getElementById('cityStage').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40) citySlide(dx > 0 ? -1 : 1);
  });

  buildCities();
  resetCityTimer();
  </script>

  <script src="assets/js/main.js?v=2"></script>
